x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  env_file: .env
  environment:
    MONGODB_URI: mongodb://mongo:27017/crm
  depends_on:
    mongo:
      condition: service_healthy
  volumes:
    - .:/app
    - /app/node_modules
    - /app/apps/crm-api/node_modules
    - /app/apps/ai-gateway/node_modules
    - /app/apps/web/node_modules
    - /app/packages/contracts/node_modules
    - /app/packages/db/node_modules
    - /app/packages/field-engine/node_modules
    - /app/packages/ai-kit/node_modules

services:
  mongo:
    image: mongo:8
    container_name: crm-mongo
    restart: unless-stopped
    ports:
      - '37017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 })']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  crm-api:
    <<: *app
    container_name: crm-api
    working_dir: /app/apps/crm-api
    # Chama o tsx direto (em vez de `pnpm run dev`) — o `pnpm --filter` faz um
    # check de deps a cada start que quebra com "disk I/O error" no índice
    # sqlite do store quando /app é bind mount (Docker Desktop no macOS).
    command: /app/node_modules/.bin/tsx watch src/server.ts
    ports:
      - '18080:18080'

  ai-gateway:
    <<: *app
    container_name: crm-ai-gateway
    working_dir: /app/apps/ai-gateway
    command: /app/node_modules/.bin/tsx watch src/server.ts
    ports:
      - '18081:18081'

  web:
    <<: *app
    container_name: crm-web
    working_dir: /app/apps/web
    # /app/apps/web/node_modules/.bin (não o /app/node_modules/.bin raiz,
    # como crm-api/ai-gateway usam pro tsx): `vite` só é dependência DIRETA
    # de apps/web/package.json, nunca da raiz — o pnpm só promove um bin pro
    # node_modules/.bin raiz quando o pacote é dependência direta dali (caso
    # do tsx) ou por uma heurística de hoist oportunista sem ambiguidade,
    # que não é garantida entre reinstalls (já vimos o root resolver ora pra
    # vite@7, ora nem existir, dependendo do resto do grafo de deps). O
    # caminho local a apps/web sempre existe, sem depender de hoist nenhum.
    command: /app/apps/web/node_modules/.bin/vite --host 0.0.0.0
    depends_on:
      - crm-api
    ports:
      - '15173:15173'

volumes:
  mongo-data:
